button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}

.topbar{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:118%;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;display:flex;align-items:center;gap:8px;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .mark{display:flex;gap:2px;flex:none}
.brand .mark i{width:5px;height:14px;border-radius:2px;background:var(--mc)}
.mepill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:.85rem;min-height:36px;flex:none}
.mepill.empty{padding-left:12px;color:var(--accent);border-color:var(--accent)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Tabs share the width by content, so a long label (Leaderboards) gets the room it needs. */
.nav-in{max-width:680px;margin:0 auto;display:flex}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;color:var(--muted);font-size:.64rem;font-weight:600;letter-spacing:0;padding:0 2px;min-width:0;flex:1 1 auto;white-space:nowrap}
.nav svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:8px 112px}
@media (min-width:760px){
  .nav{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
  .nav button{flex-direction:row;gap:7px;min-height:48px;font-size:.82rem}
  .nav svg{width:18px;height:18px}
  .wrap{padding-block:20px 56px}
}

/* hero scoreboard */
.hero{display:grid;gap:12px;padding-block:6px 4px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dayline{display:flex;align-items:flex-end;gap:10px}
.daynum{font-family:var(--f-display);font-weight:900;font-stretch:125%;font-size:clamp(2.7rem,13vw,4.2rem);line-height:.86;text-transform:uppercase;font-variant-numeric:tabular-nums}
.daynum small{font-size:.38em;font-weight:700;color:var(--muted);font-stretch:100%;margin-left:6px;letter-spacing:0}
.daynav{margin-left:auto;display:flex;gap:6px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);padding:0}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:18px;height:18px}
.todaybtn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:0 12px;height:40px;font-weight:700;font-size:.8rem}
.dateline{color:var(--muted);font-weight:600}
.dateline b{color:var(--fg)}
.teambar{display:flex;gap:3px;height:18px}
.teambar .seg{position:relative;flex:var(--f) 1 0;min-width:6px;border-radius:5px;overflow:hidden;background:var(--surface-2);background:color-mix(in srgb,var(--mc) 20%,var(--surface-2))}
.teambar .seg i{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--mc)}
.teambar.none{background:var(--surface-2);border-radius:5px}
.teamlabel{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.teamlabel b{color:var(--fg);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;font-weight:850;font-stretch:110%;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{display:block;font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-h.tight{margin-top:18px}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 10px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-stretch:115%;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;flex:none}
.sec-h span{font-size:.8rem;color:var(--muted);text-align:right}

/* member cards */
.lineup{display:grid;gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.mcard.me{border-color:color-mix(in srgb,var(--mc) 55%,var(--line));background:color-mix(in srgb,var(--mc) 6%,var(--surface))}
.mhead{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;background:var(--mc);color:var(--on-m);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.9rem}
.avatar.sm{width:24px;height:24px;font-size:.7rem}
.mname{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mname small{font-weight:500;color:var(--muted)}
.mscore{margin-left:auto;font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem;padding:3px 10px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.mscore.full{background:var(--done);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px 6px 8px;min-height:44px;text-align:left;max-width:100%}
button.chip:active{transform:scale(.97)}
.chip .st{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px dashed var(--muted);display:grid;place-items:center}
.chip .st svg{width:14px;height:14px}
.chip .cx{display:grid;line-height:1.2;min-width:0}
.chip .nm{font-weight:700;font-size:.9rem}
.chip .nm em{font-style:normal;font-family:var(--f-display);font-weight:800;font-size:.72rem;color:var(--muted);margin-left:5px}
.chip small{color:var(--muted);font-size:.75rem}
.chip.done{border-color:var(--done);background:color-mix(in srgb,var(--done) 12%,var(--surface))}
.chip.done .st{border:0;background:var(--done);color:var(--surface)}
.chip.late{border-style:dashed;border-color:var(--done);background:color-mix(in srgb,var(--done) 6%,var(--surface))}
.chip.late .st{border:1.5px solid var(--done);background:var(--surface);color:var(--done)}
.chip.skip{border-color:color-mix(in srgb,var(--skip) 50%,var(--line))}
.chip.skip .nm{text-decoration:line-through;color:var(--muted)}
.chip.skip .st{border:0;background:var(--skip);color:var(--surface)}
.chip.rest{border-style:dashed;color:var(--muted)}
.chip.rest .st{border-style:solid}
.chip:not(button){cursor:default}
.catchup{border:1.5px dashed color-mix(in srgb,var(--done) 55%,var(--line));border-radius:12px;padding:10px;display:grid;gap:8px}
.catchup .lbl{color:var(--fg)}
.hint{font-size:.8rem;color:var(--muted)}
.empty-line{color:var(--muted);font-size:.88rem}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}

/* heatmap */
.hm-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 0;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hm-wrap::-webkit-scrollbar{display:none}
.hm-box{position:relative;min-width:0}
.hm-more{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;padding:0;box-shadow:0 1px 4px color-mix(in srgb,var(--fg) 18%,transparent)}
.hm-more svg{width:12px;height:12px}
.hm-more.l{left:calc(var(--namew,40px) - 4px)}
.hm-more.r{right:-6px}
.hm{display:grid;column-gap:2px;row-gap:3px;align-items:center;width:max-content}
.hm-name,.hm-corner{position:sticky;left:0;z-index:2;align-self:stretch;background:var(--surface);box-shadow:3px 0 0 var(--surface);display:flex;align-items:center;gap:6px;padding-left:10px;padding-right:6px;font-weight:600;font-size:.8rem;white-space:nowrap}
.hm-name .avatar.sm{width:26px;height:18px;border-radius:9px;font-size:.62rem;letter-spacing:.02em}
@media (min-width:560px){ .hm-name .avatar.sm{height:22px;border-radius:11px} }
.hm-name .full{display:none}
@media (min-width:560px){ .hm-name .full{display:inline;max-width:6.5rem;overflow:hidden;text-overflow:ellipsis} }
.hm-h{font-size:.62rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;line-height:1.5}
.hm-h.wk{color:var(--fg);font-weight:800}
.hm-h.today{color:var(--accent);font-weight:800}
.cell{width:100%;min-width:0;height:18px;border-radius:3px;border:0;padding:0;position:relative;background:var(--surface-2);background:color-mix(in srgb,var(--mc) var(--p),var(--surface-2))}
@media (min-width:560px){ .cell{height:22px;border-radius:4px} }
.cell.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cell.rest{background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--line)}
.cell.none{background:var(--surface-2);opacity:.45}
.cell.missed{background:color-mix(in srgb,var(--skip) 28%,var(--surface-2))}
.cell.late::after{content:"";position:absolute;right:1px;top:1px;width:5px;height:5px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--fg)}
.cell.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cell{width:14px;height:14px;border-radius:4px;--mc:var(--muted);display:inline-block}
.legend .cell.late::after{width:4px;height:4px;right:1px;top:1px}

/* standings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:grid;grid-template-columns:1.4rem 32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.rank{font-family:var(--f-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:var(--w);background:var(--mc)}
.num{text-align:right;font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.num small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.72rem}

/* forms, cards, buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.card h2,.page-h{font-family:var(--f-display);font-weight:850;font-stretch:115%;font-size:1.4rem;line-height:1.1}
.card h2.sm{font-size:1.1rem}
.page-h{margin-block:8px 4px}
.lead{color:var(--muted);max-width:60ch}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=search],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;min-height:44px;font-weight:700;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--skip);border-color:color-mix(in srgb,var(--skip) 45%,var(--line))}
.btn.armed{background:var(--skip);border-color:var(--skip);color:var(--surface)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{border-radius:var(--r-sm);padding:10px 12px;font-size:.85rem;background:var(--surface);border:1px solid var(--line);background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.banner.warn{background:color-mix(in srgb,var(--skip) 9%,var(--surface));border-color:color-mix(in srgb,var(--skip) 35%,var(--line))}
.who{display:flex;flex-wrap:wrap;gap:8px}
.who button{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700;min-height:42px}
.who button[aria-pressed="true"]{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 12%,var(--surface))}

/* plan editor */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;position:relative}
.dbtn{flex:none;width:52px;padding:7px 0 7px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;justify-items:center;gap:3px}
.dbtn small{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.dbtn b{font-family:var(--f-display);font-weight:850;font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1}
.pip{width:24px;height:4px;border-radius:2px;background:var(--surface-2)}
.pip.full{background:var(--done)}
.pip.part{background:linear-gradient(90deg,var(--done) var(--w),var(--surface-2) 0)}
.pip.rest{background:repeating-linear-gradient(90deg,var(--muted) 0 2px,transparent 2px 4px)}
.pip.missed{background:var(--skip)}
.pip.future{background:var(--line)}
.dbtn.today{border:2px solid var(--accent)}
.dbtn.sel{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.dbtn.sel small{color:inherit;opacity:.8}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dayhead h2{font-size:1.6rem}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.now{background:var(--accent);color:var(--accent-ink)}
.items{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;min-width:0}
.item-top{display:grid;grid-template-columns:minmax(0,1fr) 7.5rem 44px;gap:8px;align-items:center}
.item-top.nolvl{grid-template-columns:minmax(0,1fr) 44px}
.item-top.locked{grid-template-columns:minmax(0,1fr) 7.5rem}
.item-top.locked.nolvl{grid-template-columns:minmax(0,1fr)}
select:disabled{opacity:.75;background-image:none;padding-right:12px}
.item-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.item-desc{color:var(--muted);font-size:.86rem;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.state{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.state.done{background:color-mix(in srgb,var(--done) 15%,var(--surface));color:var(--done)}
.state.skip,.state.missed{background:color-mix(in srgb,var(--skip) 12%,var(--surface));color:var(--skip)}
.rmbtn{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);padding:0}
.rmbtn svg{width:16px;height:16px}
.rmbtn.armed{background:var(--skip);color:var(--surface);border-color:var(--skip)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 14px;min-height:36px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-s="done"]{background:var(--done);color:var(--surface)}
.seg button.on[data-s="skip"]{background:var(--skip);color:var(--surface)}

/* exercises */
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbox input{padding-left:38px}
.exlist{display:grid;gap:10px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-width:0}
.excard-h{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.excard h3{font-family:var(--f-display);font-weight:800;font-stretch:108%;font-size:1.1rem}
.muscles{font-size:.85rem;color:var(--muted)}
.muscles b{color:var(--fg);font-weight:600}
.lvls{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lvls li{display:flex;gap:10px;font-size:.9rem}
.lvls b{font-family:var(--f-display);font-weight:800;font-size:.72rem;color:var(--muted);min-width:1.8rem;padding-top:2px}
.reflink{font-size:.85rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.reflink:hover{text-decoration:underline}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--mc);padding:0}
.palette{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 6px 52px}
.palette button{width:34px;height:34px;border-radius:50%;background:var(--mc);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.palette button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.palette button.taken::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface);opacity:.85}

/* plans */
.plancard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.plancard h3{font-family:var(--f-display);font-weight:800;font-stretch:108%;font-size:1.15rem}
.plancard .by{font-size:.8rem;color:var(--muted);font-weight:600}
.sessions{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sessions li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:8px;font-size:.88rem;align-items:baseline}
.sessions li b{font-family:var(--f-display);font-weight:850;color:var(--muted);font-size:.8rem}
.apply{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds button{min-width:46px;height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.82rem;padding:0 10px}
.wds button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.preview{font-size:.85rem;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.session-ed{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.session-ed .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.session-ed .sh b{font-family:var(--f-display);font-weight:850}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.88rem;max-width:calc(100% - 32px);text-align:center}
@media (min-width:760px){.toast{bottom:24px}}
.loading{padding:48px 0;text-align:center;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
/* medals, leaderboards, recap */
:root{--gold:#E3B11E;--silver:#B9C2CC;--bronze:#C0753A}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 13px;min-height:36px;font-weight:700;font-size:.84rem;color:var(--fg)}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.lbrow{grid-template-columns:28px 32px minmax(0,1fr) auto}
.lbrow.me{background:color-mix(in srgb,var(--mc) 7%,var(--surface))}
.rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:850;font-size:.8rem;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.rk.r1{background:var(--gold);color:#3A2A00}
.rk.r2{background:var(--silver);color:#1E2630}
.rk.r3{background:var(--bronze);color:#FFFFFF}
.lbdesc{font-size:.82rem;color:var(--muted);margin:2px 0 10px}
button.srow{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit}
button.srow:first-child{border-top:0}
.lbmini{grid-template-columns:minmax(0,6.6rem) minmax(0,1fr) auto;padding-block:9px}
.lbmini[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.lbmini .lbl{color:var(--muted);font-size:.8rem}
.who2{display:flex;align-items:center;gap:8px;min-width:0}
.who2 .stack{display:flex;flex:none}
.who2 .stack .avatar+.avatar{margin-left:-9px;box-shadow:0 0 0 2px var(--surface)}
.who2 .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.star{display:inline-grid;place-items:center;filter:drop-shadow(0 0 .6px rgba(0,0,0,.8)) drop-shadow(0 0 .5px rgba(0,0,0,.6))}
.star b{display:block;width:11px;height:11px;background:var(--bronze);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.s2 b{background:var(--silver)}
.star.s3 b{background:var(--gold)}
.cell .star{position:absolute;left:1px;top:1px;display:block;pointer-events:none}
.cell .star b{width:9px;height:9px}
@media (min-width:560px){ .cell .star{left:2px;top:2px} .cell .star b{width:11px;height:11px} }
.mhead .star b{width:17px;height:17px}
.legend .star b{width:12px;height:12px}
/* recap */
.recap-hero{display:grid;gap:12px;padding-block:6px 4px}
.recap-title{font-family:var(--f-display);font-weight:900;font-stretch:125%;font-size:clamp(2.1rem,10vw,3.4rem);line-height:.92;text-transform:uppercase}
.recap-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){ .recap-stats{grid-template-columns:repeat(4,minmax(0,1fr))} }
.awards{display:grid;gap:12px}
@media (min-width:600px){ .awards{grid-template-columns:repeat(2,minmax(0,1fr))} }
.award{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.aw-who{display:flex;align-items:center;gap:10px;min-width:0}
.aw-who .avatar{width:40px;height:40px;font-size:1.05rem}
.award .ttl{font-family:var(--f-display);font-weight:850;font-stretch:115%;font-size:1.3rem;line-height:1.1}
.award .blurb{font-size:.95rem;line-height:1.5;white-space:pre-line}
.award .mini{display:flex;flex-wrap:wrap;gap:6px}
.award .mini span{font-size:.76rem;font-weight:700;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.ribbon{margin-left:auto;width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mc) 16%,var(--surface));color:var(--mc)}
.ribbon svg{width:18px;height:18px}
#fx,#leaves{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:40}
/* behind the page content: leaves show in the gaps between cards, never over text */
#leaves{z-index:-1}
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  .cell.part{background:var(--mc);opacity:.5}
  .cell.full{background:var(--mc)}
  .cell.missed{background:var(--skip);opacity:.35}
  .nav{background:var(--bg)}
  .chip.done,.chip.late{background:var(--surface)}
}
@media (prefers-reduced-motion:no-preference){
  .chip,.cell,.dbtn,.btn{transition:transform .12s ease,background-color .2s ease,border-color .2s ease}
  .teambar .seg i,.bar i{transition:width .35s ease}
}
/* Fall theme (chosen per challenge: settings.theme = "fall"). Same layout; harvest palette and leaf-shaped marks.
   Member colors are left alone so everyone keeps their color. */
:root[data-skin="fall"]{
  --bg:#F2E7D8; --surface:#FFFAF2; --surface-2:#EADCC6; --line:#DCC8AC;
  --fg:#2B1A10; --muted:#7A604C; --accent:#B8430F; --accent-ink:#FFFFFF;
  --done:#3E7B35; --skip:#B42318; --on-m:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root[data-skin="fall"]:not([data-theme="light"]){
    --bg:#16100C; --surface:#211812; --surface-2:#2D221A; --line:#3E3026;
    --fg:#F4E8DA; --muted:#B69E89; --accent:#F28C3A; --accent-ink:#1C1007;
    --done:#7FBF6E; --skip:#F2785F; --on-m:#16100C;
    color-scheme:dark;
  }
}
:root[data-skin="fall"][data-theme="dark"]{
  --bg:#16100C; --surface:#211812; --surface-2:#2D221A; --line:#3E3026;
  --fg:#F4E8DA; --muted:#B69E89; --accent:#F28C3A; --accent-ink:#1C1007;
  --done:#7FBF6E; --skip:#F2785F; --on-m:#16100C;
  color-scheme:dark;
}
:root[data-skin="fall"] .brand .mark i{width:8px;height:12px;border-radius:8px 0 8px 0}
:root[data-skin="fall"] .eyebrow{color:var(--accent)}
/* The scene: a fixed autumn landscape behind the page (sky, sun, hills, two trees). Cards stay opaque, and text that
   sits straight on the scene gets a soft halo in the page color, so it reads on any part of the picture. */
#scene{display:none}
:root[data-skin="fall"]{background:var(--bg);
  --sky1:#FBF1E4; --sky2:#F8E2C8; --sky3:#F3CFA8; --sun:#FFE3A6;
  --hl1:#F3D8B6; --hl2:#EDC398; --hl3:#E4AE7E; --trunk:#8A5A3B;
  --fo1:#E8833A; --fo2:#F2A93B; --fo3:#D9542C; --fo4:#F5C451; --fo5:#FFE08A}
@media (prefers-color-scheme: dark){
  :root[data-skin="fall"]:not([data-theme="light"]){
    --sky1:#100A07; --sky2:#1A110C; --sky3:#2A1A11; --sun:#F1DDB4;
    --hl1:#22170F; --hl2:#2C1D13; --hl3:#362317; --trunk:#4A3324;
    --fo1:#A8481B; --fo2:#B97A26; --fo3:#8E3418; --fo4:#C49A3A; --fo5:#D8B060}
}
:root[data-skin="fall"][data-theme="dark"]{
  --sky1:#100A07; --sky2:#1A110C; --sky3:#2A1A11; --sun:#F1DDB4;
  --hl1:#22170F; --hl2:#2C1D13; --hl3:#362317; --trunk:#4A3324;
  --fo1:#A8481B; --fo2:#B97A26; --fo3:#8E3418; --fo4:#C49A3A; --fo5:#D8B060}
:root[data-skin="fall"] body{background:transparent}
:root[data-skin="fall"] #scene{display:block;position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%)}
#scene svg{position:absolute;display:block}
/* Optional photo instead of the drawn scene: a portrait file for tall screens, a landscape one for wide ones, under a veil
   in the page color (stronger at the top and bottom, where the day header and the tab bar sit). */
.sc-photo{display:none;position:absolute;inset:0;background:var(--bg-l) center/cover no-repeat}
@media (max-aspect-ratio:1/1){ .sc-photo{background-image:var(--bg-p)} }
#scene.photo .sc-photo{display:block}
#scene.photo > svg,#scene.photo .sc-sun{display:none}
#scene.photo::after{content:"";position:absolute;inset:0;opacity:var(--veil,.55);background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 70%,transparent) 38%,color-mix(in srgb,var(--bg) 70%,transparent) 70%,var(--bg) 100%)}
/* Dark mode dims the photo further so it sits back behind the dark page. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #scene.photo::after{opacity:calc(var(--veil,.55) + .22)} }
:root[data-theme="dark"] #scene.photo::after{opacity:calc(var(--veil,.55) + .22)}
/* With a photo, the content column is frosted (blurred and lightly tinted): the photo's fine detail is what makes text
   hard to read, so blurring it keeps the colors and shapes while text on it stays legible. The sides stay sharp on wide screens. */
:root[data-photo] .wrap,:root[data-photo] .topbar{background:color-mix(in srgb,var(--bg) 42%,transparent);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
/* Wide screens: the tab bar sits on the top edge of the column at the column's width, so it reads as part of it. */
@media (min-width:760px){ :root[data-photo] .nav{max-width:680px;margin-inline:auto;background:color-mix(in srgb,var(--bg) 80%,transparent)} }
/* Tall screens: the portrait file is already softened, so phones skip the live blur (cheaper while the leaves fall). */
@media (max-aspect-ratio:1/1){ :root[data-photo] .wrap,:root[data-photo] .topbar{background:color-mix(in srgb,var(--bg) 50%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none} }
.credit{margin-top:32px;font-size:.75rem;color:var(--muted);text-align:center;text-wrap:balance}
.credit a{color:inherit}
.sc-sun{position:absolute;right:9%;top:13%;width:min(30vmin,240px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--sun) 0 52%,transparent 71%);opacity:.75}
.sc-hills{left:0;bottom:0;width:100%;height:40vh}
.sc-tree.l{left:max(-60px,calc(50% - 560px));bottom:15vh;height:min(50vh,470px);width:auto;aspect-ratio:240/330}
.sc-tree.r{right:max(-44px,calc(50% - 520px));bottom:18vh;height:min(36vh,340px);width:auto;aspect-ratio:200/290}
#scene .h1{fill:var(--hl1)} #scene .h2{fill:var(--hl2)} #scene .h3{fill:var(--hl3)} #scene .tr{fill:var(--trunk)}
#scene .f1,#scene .l1{fill:var(--fo1)} #scene .f2,#scene .l2{fill:var(--fo2)} #scene .f3,#scene .l3{fill:var(--fo3)} #scene .f4{fill:var(--fo4)} #scene .f5{fill:var(--fo5)}
#scene .cn{opacity:.92}
/* Phones: smaller trees that peek in from the sides below the hero, so the middle of the screen stays calm. */
@media (max-width:700px){
  .sc-hills{height:34vh}
  .sc-tree.l{left:-92px;bottom:9vh;height:36vh}
  .sc-tree.r{right:-72px;bottom:12vh;height:28vh}
  #scene .cn{opacity:.82}
}
@media (prefers-color-scheme: dark){ :root[data-skin="fall"]:not([data-theme="light"]) .sc-sun{opacity:.2} :root[data-skin="fall"]:not([data-theme="light"]) #scene .cn{opacity:.8} }
:root[data-skin="fall"][data-theme="dark"] .sc-sun{opacity:.2}
:root[data-skin="fall"] :is(.brand,.eyebrow,.daynum,.dateline,.teamlabel,.sec-h,.lead,.page-h,.legend,.recap-title,.lbdesc,.empty-line,.wrap > .hint,.hint[style]){text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg)}
</style>

function calm(){ try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } }
function fitCanvas(cv){

var LV = {on:false, cv:null, raf:0, list:[], last:0};
var LEAF_COLORS = ['#C2410C','#D97706','#B45309','#9A3412','#CA8A04','#B91C1C','#A16207'];
var LEAF_COLORS_DARK = ['#F28C3A','#E8A33D','#D9622B','#E3B11E','#C9772E','#E0533A'];
function isDark(){ var t = document.documentElement.getAttribute('data-theme'); if (t) return t === 'dark'; try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){ return false; } }

  return {x: Math.random() * w, y: top ? -30 - Math.random() * 60 : Math.random() * h, s: 7 + Math.random() * 7,
    vy: 22 + Math.random() * 30, sway: 14 + Math.random() * 22, ph: Math.random() * 6.28, fs: .5 + Math.random() * .9,
    rot: Math.random() * 6.28, vr: (Math.random() - .5) * 1.6, flip: Math.random() * 6.28, vf: 1 + Math.random() * 2,
    c: pal[Math.floor(Math.random() * pal.length)], a: dk ? .3 + Math.random() * .3 : .45 + Math.random() * .35};
}
function leaves(on){
  on = !!on && !calm();
  if (on === LV.on) return;
  LV.on = on;
  if (!on) { cancelAnimationFrame(LV.raf); if (LV.cv) LV.cv.remove(); LV.cv = null; LV.list = []; return; }
  var cv = LV.cv = document.createElement('canvas'); cv.id = 'leaves'; cv.setAttribute('aria-hidden', 'true');
  document.body.insertBefore(cv, document.body.firstChild);

  for (var i=0;i<n;i++) LV.list.push(newLeaf(f.w, f.h, false));
  LV.last = 0;
  function frame(ts){
    if (!LV.on) return;
    var dt = LV.last ? Math.min(.05, (ts - LV.last) / 1000) : 0; LV.last = ts;
    var g = fitCanvas(cv), ctx = g.ctx;
    ctx.clearRect(0, 0, g.w, g.h);
    LV.list.forEach(function(L, k){
      L.ph += L.fs * dt; L.y += L.vy * dt; L.rot += L.vr * dt; L.flip += L.vf * dt;
      var x = L.x + Math.sin(L.ph) * L.sway;
      if (L.y > g.h + 30) { LV.list[k] = newLeaf(g.w, g.h, true); return; }
      ctx.save(); ctx.translate(x, L.y); ctx.rotate(L.rot); ctx.scale(Math.max(.25, Math.abs(Math.cos(L.flip))), 1);
      ctx.globalAlpha = L.a; ctx.fillStyle = L.c;

      ctx.beginPath(); ctx.moveTo(0, -L.s * .75); ctx.lineTo(0, L.s * 1.25); ctx.stroke();

/* Confetti: cannon bursts from the bottom corners (three waves), plus a shower from the top that keeps
   coming for about 5 seconds. Pieces flutter down slowly; the whole thing runs about 10 seconds. */
function celebrate(){
  if (calm()) return;
  var old = document.getElementById('fx'); if (old) old.remove();
  var cv = document.createElement('canvas'); cv.id = 'fx'; cv.setAttribute('aria-hidden', 'true'); document.body.appendChild(cv);
  var f = fitCanvas(cv), cs = getComputedStyle(document.documentElement), cols = ['#E3B11E', '#F2C94C'];
  for (var c=0;c<NCOL;c++) { var v = cs.getPropertyValue('--m' + c).trim(); if (v) cols.push(v); }

  function piece(o){
    var round = Math.random() < .2, big = Math.random() < .15;
    parts.push(Object.assign({w: round ? 0 : (9 + Math.random() * 7) * (big ? 1.5 : 1), h: round ? 0 : 5 + Math.random() * 5, r: round ? 3.5 + Math.random() * 3 : 0,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * 10, fl: Math.random() * 6.28, vf: 3 + Math.random() * 7,
      ph: Math.random() * 6.28, sw: 25 + Math.random() * 45, c: cols[Math.floor(Math.random() * cols.length)]}, o));
  }
  function burst(n, delay){
    for (var i=0;i<n;i++){
      var left = i % 2 === 0, ang = Math.PI / 2 - (.2 + Math.random() * .6), sp = f.h * (1.05 + Math.random() * .85);
      piece({x: left ? -10 : f.w + 10, y: f.h * (.7 + Math.random() * .15), vx: Math.cos(ang) * sp * (left ? 1 : -1) * .62, vy: -Math.sin(ang) * sp, delay: delay + Math.random() * .3});
    }
  }
  burst(Math.round(240 * scale), 0);
  burst(Math.round(150 * scale), 1.1);
  burst(Math.round(100 * scale), 2.6);
  for (var k=0, n=Math.round(230 * scale); k<n; k++) piece({x: Math.random() * f.w, y: -20 - Math.random() * 80, vx: (Math.random() - .5) * 60, vy: 40 + Math.random() * 80, delay: .4 + Math.random() * 4.8});

    if (!t0) { t0 = ts; last = ts; }
    var dt = Math.min(.04, (ts - last) / 1000), el = (ts - t0) / 1000; last = ts;
    var g = fitCanvas(cv), ctx = g.ctx, alive = 0, fade = el > END - 1.5 ? Math.max(0, (END - el) / 1.5) : 1;
    ctx.clearRect(0, 0, g.w, g.h);

      p.vy += 900 * dt;
      var drag = Math.pow(.3, dt); p.vx *= drag; p.vy *= p.vy > 0 ? Math.pow(.006, dt) : drag;   /* falling pieces drift down slowly */

      p.x += (p.vx + (p.vy > 0 ? Math.sin(p.ph) * p.sw : 0)) * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.fl += p.vf * dt;
      if (p.y > g.h + 30) { p.gone = true; return; }

      ctx.globalAlpha = fade; ctx.fillStyle = p.c;
      if (p.r) { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 6.2832); ctx.fill(); } else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);

}

/* Check-in times, with the day starting at 4am so a 12:30am check-in counts as late, not early. */

  var list = AWARDS.filter(function(a){ return !a.v2 || rules() >= 2; }), out = {}, used = {};

/* ---------- next challenge: copy people, exercises and shared plans into a new group ---------- */
function fsPut(code, col, id, data){
  var url = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(CONFIG.firebaseProject) + '/databases/(default)/documents/groups/' + code + '/' + col + '/' + encodeURIComponent(id) + (CONFIG.firebaseApiKey ? '?key=' + encodeURIComponent(CONFIG.firebaseApiKey) : '');
  return fetch(url, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fields:{json:{stringValue: JSON.stringify(data)}}})})
    .then(function(r){ if (!r.ok) throw {code: r.status === 429 ? 'rate_limited' : 'http', message:'HTTP ' + r.status}; });
}
function runPool(tasks, n){
  var i = 0;
  function worker(){ if (i >= tasks.length) return Promise.resolve(); var t = tasks[i++]; return t().then(worker); }
  var ws = []; for (var k=0; k<Math.min(n, tasks.length); k++) ws.push(worker());
  return Promise.all(ws);
}
function startNext(title, start, L2){
  var code = newGroupKey(), oldCode = groupKey(), oldTitle = (settings() && settings().title) || 'Friends Workout';
  S.nextBusy = {done:0, total:0}; render();
  return Promise.all([S.store.listOnce('members'), S.store.listOnce('exercises'), S.store.listOnce('meta')]).then(function(res){
    var writes = [], now = Date.now();
    res[0].forEach(function(d){ var m = d.data || {}; if (!m.name) return; writes.push(['members', d.id, {name:m.name, color:m.color || 0, order:m.order || 0, plan:[], log:{}, base:start, updatedAt:now}]); });
    res[1].forEach(function(d){ if (d.data) writes.push(['exercises', d.id, d.data]); });

    mutate('meta', 'recap', function(doc){ doc = doc || {}; doc.awards = doc.awards || {}; if (t || bl) doc.awards[id] = Object.assign({}, doc.awards[id] || {}, {title:t, blurb:bl}); else delete doc.awards[id]; return doc; });
  },
  nextch: function(f){
    if (S.nextBusy || S.mode !== 'firebase' || !S.store) return;
    var title = f.title.value.trim() || 'Friends Workout', start = f.start.value || todayStr(), L2 = clamp(parseInt(f.length.value, 10) || len(), 1, 366);
    startNext(title, start, L2);
  },
  addmember: function(f){
    var n = f.name.value.trim(); if (!n) return;
    var id = uniqueId(n, S.data.members, 'm'), used = members().map(function(m){ return (m.color || 0) % NCOL; }), c = 0;
    while (used.indexOf(c) >= 0 && c < NCOL - 1) c++;
    var maxOrder = members().reduce(function(a, m){ return Math.max(a, m.order || 0); }, -1);
    save('members', id, {name:n, color:c, order:maxOrder + 1, plan:[], log:{}, base:settings().startDate});
    toast(n + ' added');
  },
  ex: function(f){
    var id = f.dataset.id, name = f.name.value.trim(); if (!name) return;
    var kind = id === 'rest' ? 'rest' : f.kind.value, levels = kind === 'rest' ? [] : f.levels.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    var prev = id ? clone(ex(id)) : {};
    if (!id) { id = uniqueId(name, exMap(), 'e'); prev.order = 1000 + Object.keys(S.data.exercises).length; }
    prev.name = name; prev.kind = kind; prev.levels = levels; prev.muscles = f.muscles.value.trim();
    var url = f.url.value.trim(); prev.url = url || null; prev.ref = null; delete prev.deleted;
    if (url && !/^https?:\/\//i.test(url)) prev.url = 'https://' + url;
    S.editEx = null; save('exercises', id, prev); toast('Saved ' + name);
  }
};
var confirmTimer = null;
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
  var key = b.dataset.confirm;
  if (key && S.confirmKey !== key) {
    S.confirmKey = key; render();
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(function(){ if (S.confirmKey === key) { S.confirmKey = null; scheduleRender(); } }, 4000);
    return;
  }
  clearTimeout(confirmTimer);
  S.confirmKey = null;
  var fn = A[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('change', function(e){ var el = e.target.closest('[data-chg]'); if (el && C[el.dataset.chg]) C[el.dataset.chg](el); });
function markDirty(e){ if (e.target && e.target.closest && e.target.closest('[data-keep]')) e.target.dataset.dirty = '1'; }
document.addEventListener('input', function(e){ markDirty(e); if (e.target.id === 'ex-search') { S.exQuery = e.target.value; applyExFilter(); } });
document.addEventListener('change', markDirty, true);
document.addEventListener('submit', function(e){ var f = e.target; if (f.dataset && f.dataset.form) { e.preventDefault(); if (F[f.dataset.form]) F[f.dataset.form](f); } });

/* ---------- boot ---------- */
window.addEventListener('hashchange', function(){
  var m = (location.hash || '').match(/^#k=([A-Za-z0-9_-]{20,64})$/);
  if (!m) return;
  if (S.mode === 'firebase' && m[1] !== groupKeyMem) { setGroupKey(m[1]); location.reload(); }
  else if (S.mode === 'nogroup') { setGroupKey(m[1]); startFirebase(); }
});
function startFirebase(){
  var k = groupKey();
  if (!k) { S.mode = 'nogroup'; render(); return; }
  try { if (location.hash !== '#k=' + k) history.replaceState(null, '', location.pathname + location.search + '#k=' + k); } catch(e){}
  S.store = firebaseStore(CONFIG, k); S.mode = 'firebase'; start();
}
function start(){
  S.store.watch('meta', function(d){ ingest('meta', d); }, 60000);
  S.store.watch('members', function(d){ ingest('members', d); }, 15000);
  S.store.watch('exercises', function(d){ ingest('exercises', d); }, 120000);
  resumePending();
  render();
}
render();
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('db').then(function(db){
    if (!db) { S.mode = 'offline'; render(); return; }
    S.store = claudeStore(db); S.mode = 'claude'; start();
    window.claude.use('user').then(function(u){ return u ? u.can('data.write') : null; }).then(function(c){ if (c === false) { S.readOnly = true; render(); } }, function(){});
  }, function(){ S.mode = 'offline'; render(); });
} else if (CONFIG.firebaseProject) {
  startFirebase();
} else {
  S.store = localStore(); S.mode = 'local'; start();
}
var lastDay = todayStr();
function checkDay(){ if (todayStr() !== lastDay) { lastDay = todayStr(); autoBackupStarted = false; S.hmReset = true; render(); } }
setInterval(checkDay, 60000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) checkDay(); });
window.addEventListener('focus', checkDay);
})();
