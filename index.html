a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}

.topbar{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:118%;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;display:flex;align-items:center;gap:8px;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .mark{display:flex;gap:2px;flex:none}
.brand .mark i{width:5px;height:14px;border-radius:2px;background:var(--mc)}
.mepill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:.85rem;min-height:36px;flex:none}
.mepill.empty{padding-left:12px;color:var(--accent);border-color:var(--accent)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;color:var(--muted);font-size:.68rem;font-weight:600;letter-spacing:.01em;padding:0 2px}
.nav svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:8px 112px}
@media (min-width:760px){
  .nav{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
  .nav button{flex-direction:row;gap:8px;min-height:48px;font-size:.85rem}
  .nav svg{width:18px;height:18px}
  .wrap{padding-block:20px 56px}
}

/* hero scoreboard */
.hero{display:grid;gap:12px;padding-block:6px 4px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dayline{display:flex;align-items:flex-end;gap:10px}
.daynum{font-family:var(--f-display);font-weight:900;font-stretch:125%;font-size:clamp(2.7rem,13vw,4.2rem);line-height:.86;text-transform:uppercase;font-variant-numeric:tabular-nums}
.daynum small{font-size:.38em;font-weight:700;color:var(--muted);font-stretch:100%;margin-left:6px;letter-spacing:0}
.daynav{margin-left:auto;display:flex;gap:6px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);padding:0}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:18px;height:18px}
.todaybtn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:0 12px;height:40px;font-weight:700;font-size:.8rem}
.dateline{color:var(--muted);font-weight:600}
.dateline b{color:var(--fg)}
.teambar{display:flex;gap:3px;height:18px}
.teambar .seg{position:relative;flex:var(--f) 1 0;min-width:6px;border-radius:5px;overflow:hidden;background:color-mix(in srgb,var(--mc) 20%,var(--surface-2))}
.teambar .seg i{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--mc)}
.teambar.none{background:var(--surface-2);border-radius:5px}
.teamlabel{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.teamlabel b{color:var(--fg);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:1.55rem;font-weight:850;font-stretch:110%;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.74rem;color:var(--muted);font-weight:600}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 10px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-stretch:115%;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}
.sec-h span{font-size:.8rem;color:var(--muted)}

/* member cards */
.lineup{display:grid;gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.mcard.me{border-color:color-mix(in srgb,var(--mc) 55%,var(--line));background:color-mix(in srgb,var(--mc) 6%,var(--surface))}
.mhead{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;background:var(--mc);color:var(--on-m);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.9rem}
.avatar.sm{width:24px;height:24px;font-size:.7rem}
.mname{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mname small{font-weight:500;color:var(--muted)}
.mscore{margin-left:auto;font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem;padding:3px 10px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.mscore.full{background:var(--done);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px 6px 8px;min-height:44px;text-align:left;max-width:100%}
button.chip:active{transform:scale(.97)}
.chip .st{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px dashed var(--muted);display:grid;place-items:center}
.chip .st svg{width:14px;height:14px}
.chip .cx{display:grid;line-height:1.2;min-width:0}
.chip .nm{font-weight:700;font-size:.9rem}
.chip .nm em{font-style:normal;font-family:var(--f-display);font-weight:800;font-size:.72rem;color:var(--muted);margin-left:5px}
.chip small{color:var(--muted);font-size:.75rem}
.chip.done{border-color:var(--done);background:color-mix(in srgb,var(--done) 12%,var(--surface))}
.chip.done .st{border:0;background:var(--done);color:var(--surface)}
.chip.late{border-style:dashed;border-color:var(--done);background:color-mix(in srgb,var(--done) 6%,var(--surface))}
.chip.late .st{border:1.5px solid var(--done);background:var(--surface);color:var(--done)}
.chip.skip{border-color:color-mix(in srgb,var(--skip) 50%,var(--line))}
.chip.skip .nm{text-decoration:line-through;color:var(--muted)}
.chip.skip .st{border:0;background:var(--skip);color:var(--surface)}
.chip.rest{border-style:dashed;color:var(--muted)}
.chip.rest .st{border-style:solid}
.chip:not(button){cursor:default}
.catchup{border:1.5px dashed color-mix(in srgb,var(--done) 55%,var(--line));border-radius:12px;padding:10px;display:grid;gap:8px}
.catchup .lbl{color:var(--fg)}
.hint{font-size:.8rem;color:var(--muted)}
.empty-line{color:var(--muted);font-size:.88rem}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}

/* heatmap */
.hm-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);-webkit-overflow-scrolling:touch;position:relative}
.hm{display:grid;gap:4px;padding:12px 12px 12px 0;width:max-content;align-items:center;position:relative}
.hm-name,.hm-corner{position:sticky;left:0;z-index:1;background:var(--surface);height:100%;display:flex;align-items:center;gap:6px;padding-left:12px;padding-right:8px;font-weight:600;font-size:.8rem;white-space:nowrap;max-width:7.5rem;overflow:hidden;text-overflow:ellipsis}
.hm-h{font-size:.66rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.hm-h.wk{color:var(--fg);font-weight:800}
.hm-h.today{color:var(--accent);font-weight:800}
.cell{width:24px;height:24px;border-radius:6px;border:0;padding:0;position:relative;background:color-mix(in srgb,var(--mc) var(--p),var(--surface-2))}
.cell.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cell.rest{background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 6px);box-shadow:inset 0 0 0 1px var(--line)}
.cell.none{background:var(--surface-2);opacity:.45}
.cell.missed{background:color-mix(in srgb,var(--skip) 28%,var(--surface-2))}
.cell.late::after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1.5px var(--fg)}
.cell.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.cell.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cell{width:14px;height:14px;border-radius:4px;--mc:var(--muted);display:inline-block}
.legend .cell.late::after{width:5px;height:5px;right:2px;top:2px}

/* standings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.srow{display:grid;grid-template-columns:1.4rem 32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.rank{font-family:var(--f-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:var(--w);background:var(--mc)}
.num{text-align:right;font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.num small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.72rem}

/* forms, cards, buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.card h2,.page-h{font-family:var(--f-display);font-weight:850;font-stretch:115%;font-size:1.4rem;line-height:1.1}
.card h2.sm{font-size:1.1rem}
.page-h{margin-block:8px 4px}
.lead{color:var(--muted);max-width:60ch}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=search],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;min-height:44px;font-weight:700;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--skip);border-color:color-mix(in srgb,var(--skip) 45%,var(--line))}
.btn.armed{background:var(--skip);border-color:var(--skip);color:var(--surface)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{border-radius:var(--r-sm);padding:10px 12px;font-size:.85rem;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.banner.warn{background:color-mix(in srgb,var(--skip) 9%,var(--surface));border-color:color-mix(in srgb,var(--skip) 35%,var(--line))}
.who{display:flex;flex-wrap:wrap;gap:8px}
.who button{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700;min-height:42px}
.who button[aria-pressed="true"]{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 12%,var(--surface))}

/* plan editor */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;position:relative}
.dbtn{flex:none;width:52px;padding:7px 0 7px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;justify-items:center;gap:3px}
.dbtn small{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.dbtn b{font-family:var(--f-display);font-weight:850;font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1}
.pip{width:24px;height:4px;border-radius:2px;background:var(--surface-2)}
.pip.full{background:var(--done)}
.pip.part{background:linear-gradient(90deg,var(--done) var(--w),var(--surface-2) 0)}
.pip.rest{background:repeating-linear-gradient(90deg,var(--muted) 0 2px,transparent 2px 4px)}
.pip.missed{background:var(--skip)}
.pip.future{background:var(--line)}
.dbtn.today{border:2px solid var(--accent)}
.dbtn.sel{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.dbtn.sel small{color:inherit;opacity:.8}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dayhead h2{font-size:1.6rem}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.now{background:var(--accent);color:var(--accent-ink)}
.items{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;min-width:0}
.item-top{display:grid;grid-template-columns:minmax(0,1fr) 7.5rem 44px;gap:8px;align-items:center}
.item-top.nolvl{grid-template-columns:minmax(0,1fr) 44px}
.item-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.item-desc{color:var(--muted);font-size:.86rem;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.state{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.state.done{background:color-mix(in srgb,var(--done) 15%,var(--surface));color:var(--done)}
.state.skip,.state.missed{background:color-mix(in srgb,var(--skip) 12%,var(--surface));color:var(--skip)}
.rmbtn{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);padding:0}
.rmbtn svg{width:16px;height:16px}
.rmbtn.armed{background:var(--skip);color:var(--surface);border-color:var(--skip)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 14px;min-height:36px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-s="done"]{background:var(--done);color:var(--surface)}
.seg button.on[data-s="skip"]{background:var(--skip);color:var(--surface)}

/* exercises */
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbox input{padding-left:38px}
.exlist{display:grid;gap:10px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-width:0}
.excard-h{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.excard h3{font-family:var(--f-display);font-weight:800;font-stretch:108%;font-size:1.1rem}
.muscles{font-size:.85rem;color:var(--muted)}
.muscles b{color:var(--fg);font-weight:600}
.lvls{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lvls li{display:flex;gap:10px;font-size:.9rem}
.lvls b{font-family:var(--f-display);font-weight:800;font-size:.72rem;color:var(--muted);min-width:1.8rem;padding-top:2px}
.reflink{font-size:.85rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.reflink:hover{text-decoration:underline}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--mc);padding:0}
.palette{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 6px 52px}
.palette button{width:34px;height:34px;border-radius:50%;background:var(--mc);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.palette button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.palette button.taken::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface);opacity:.85}

/* plans */
.plancard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.plancard h3{font-family:var(--f-display);font-weight:800;font-stretch:108%;font-size:1.15rem}
.plancard .by{font-size:.8rem;color:var(--muted);font-weight:600}
.sessions{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sessions li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:8px;font-size:.88rem;align-items:baseline}
.sessions li b{font-family:var(--f-display);font-weight:850;color:var(--muted);font-size:.8rem}
.apply{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds button{min-width:46px;height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.82rem;padding:0 10px}
.wds button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.preview{font-size:.85rem;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.session-ed{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.session-ed .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.session-ed .sh b{font-family:var(--f-display);font-weight:850}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.88rem;max-width:calc(100% - 32px);text-align:center}
@media (min-width:760px){.toast{bottom:24px}}
.loading{padding:48px 0;text-align:center;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
@media (prefers-reduced-motion:no-preference){
  .chip,.cell,.dbtn,.btn{transition:transform .12s ease,background-color .2s ease,border-color .2s ease}
  .teambar .seg i,.bar i{transition:width .35s ease}
}

var VIEWS = ['board','plan','plans','exercises','group'];
var S = {

  readOnly: false, confirmKey: null, editEx: null, showWho: false,

};

function firebaseStore(cfg, code){

function spread(k, startWd){ var out = []; for (var i=0;i<k;i++){ var w = (startWd + Math.round(i*7/k)) % 7; if (out.indexOf(w) < 0) out.push(w); } return out; }
function defaultStart(m){ var t = Math.max(dayIdx(), 0); if (m && m.log && m.log[t] && Object.keys(m.log[t]).length) t++; return clamp(t, 0, len()-1); }
function newApply(p){
  var m = me(), start = defaultStart(m);
  return {id:p.id, start:start, weekdays: p.weekdays && p.weekdays.length ? p.weekdays.slice() : spread(clamp(p.days || p.sessions.length, 1, 7), weekday(start)), prog:0, mode:p.mode || 'replace', fillRest:true};
}
function applyPreview(p, a){
  var m = me(); if (!m) return {set:0, skipped:0, workouts:0};
  var set = 0, skipped = 0, workouts = 0;
  for (var j=a.start;j<len();j++){
    var logged = m.log && m.log[j] && Object.keys(m.log[j]).length, on = a.weekdays.indexOf(weekday(j)) >= 0;
    if (logged) { skipped++; continue; }
    if (on) { workouts++; set++; } else if (a.mode === 'replace') set++;

}
function doApply(p, a){
  var n = 0, k = 0;
  updateMe(function(m){
    for (var j=a.start;j<len();j++){
      var logged = m.log[j] && Object.keys(m.log[j]).length, on = a.weekdays.indexOf(weekday(j)) >= 0;
      if (logged) { if (on) k++; continue; }
      var bump = a.prog ? Math.floor((j - a.start) / (7 * a.prog)) : 0;
      if (on) {
        var ses = p.sessions[k % p.sessions.length]; k++;
        var items = (ses.items || []).map(function(it){ return {id:uid('i'), ex:it.ex, level:capLevel(it.ex, (it.level || 1) + bump)}; });
        m.plan[j] = {items: a.mode === 'add' ? (m.plan[j].items || []).concat(items) : items}; n++;
      } else if (a.mode === 'replace') {
        m.plan[j] = {items: a.fillRest && ex('rest') ? [{id:uid('i'), ex:'rest', level:1}] : []};
      }
    }
  });
  return n;
}

  return {id: keepId ? p.id : null, name: keepId ? p.name : (p.name + ' (copy)'), desc: p.desc || '', days: clamp(p.days || p.sessions.length, 1, 7), mode: p.mode || 'replace',
    sessions: p.sessions.map(function(s){ return {items:(s.items || []).map(function(it){ return {ex:it.ex, level:it.level || 1}; })}; })};
}
function firstWorkEx(){ var e = exList().filter(function(x){ return x.kind !== 'rest'; })[0]; return e ? e.id : null; }
var A = {
  nav: function(b){ setView(b.dataset.view); },
  who: function(){ if (S.view !== 'board') { setView('board'); S.showWho = true; render(); } else { S.showWho = !S.showWho; render(); } window.scrollTo(0,0); },
  iam: function(b){ S.me = b.dataset.id; LS.set('fw.me', S.me); S.showWho = false; var m = me(); render(); if (m) toast('Logged in as ' + m.name); },
  logout: function(){ S.me = null; LS.set('fw.me', null); render(); },
  day: function(b){ S.boardDay = clamp(+b.dataset.d, 0, len()-1); render(); },
  today: function(){ S.boardDay = null; render(); },
  goday: function(b){ S.boardDay = +b.dataset.d; render(); window.scrollTo({top:0, behavior:'smooth'}); },
  planday: function(b){ S.planDay = +b.dataset.d; setView('plan'); },
  pday: function(b){ S.planDay = +b.dataset.d; render(); },
  toggle: function(b){
    var d = +b.dataset.d, iid = b.dataset.item, late = d === dayIdx() - 1;
    if (!canLog(d)) return;
    updateMe(function(m){
      var e = m.log[d] && m.log[d][iid], cur = e && e.s;
      if (cur === 'done') setLog(m, d, iid, 'skip'); else if (cur === 'skip') setLog(m, d, iid, null); else setLog(m, d, iid, 'done', late);
    });
  },
  mark: function(b){
    var d = planDayIdx(), iid = b.dataset.item, s = b.dataset.s;
    if (!canLog(d)) return;
    updateMe(function(m){ var e = m.log[d] && m.log[d][iid], cur = e && e.s; setLog(m, d, iid, cur === s ? null : s, s === 'done' && d === dayIdx() - 1); });
  },
  additem: function(){
    var d = planDayIdx(), first = firstWorkEx(); if (!first) return;
    updateMe(function(m){ m.plan[d].items.push({id:uid('i'), ex:first, level:1}); });
  },
  rmitem: function(b){
    var d = planDayIdx(), iid = b.dataset.item;
    updateMe(function(m){ m.plan[d].items = m.plan[d].items.filter(function(x){ return x.id !== iid; }); if (m.log[d]) { delete m.log[d][iid]; if (!Object.keys(m.log[d]).length) delete m.log[d]; } });
  },
  clearday: function(){ var d = planDayIdx(); updateMe(function(m){ m.plan[d] = {items:[]}; delete m.log[d]; }); },
  repeat: function(){
    var d = planDayIdx(), n = 0;
    updateMe(function(m){
      var src = m.plan[d].items;
      for (var j = d + 7; j < len(); j += 7) {
        if (m.log[j] && Object.keys(m.log[j]).length) continue;
        m.plan[j] = {items: src.map(function(it){ return {id:uid('i'), ex:it.ex, level:it.level}; })}; n++;
      }
    });
    toast(n ? 'Copied to ' + n + ' later ' + (n === 1 ? 'day' : 'days') : 'No later days to copy to');
  },
  copyfrom: function(){
    var sel = document.getElementById('copyFrom'); var src = sel && S.data.members[sel.value]; if (!src) return;
    var from = Math.max(dayIdx(), 0), n = 0;
    updateMe(function(m){
      for (var j = from; j < len(); j++) {
        if (m.log[j] && Object.keys(m.log[j]).length) continue;
        var it = (src.plan && src.plan[j] && src.plan[j].items) || [];
        m.plan[j] = {items: it.map(function(x){ return {id:uid('i'), ex:x.ex, level:x.level}; })}; n++;
      }
    });
    toast('Copied ' + n + ' days from ' + src.name);
  },
  seed: function(){
    if (!SEED) return;
    ['exercises','members','meta'].forEach(function(col){ Object.keys(SEED[col] || {}).forEach(function(id){ save(col, id, clone(SEED[col][id])); }); });
    toast('Loaded the spreadsheet plan');
  },
  /* plans */
  useplan: function(b){ var p = findPlan(b.dataset.id); if (!p || !me()) return; S.applying = newApply(p); render(); },
  cancelapply: function(){ S.applying = null; render(); },
  wd: function(b){ var a = S.applying; if (!a) return; var w = +b.dataset.w, i = a.weekdays.indexOf(w); if (i >= 0) a.weekdays.splice(i, 1); else a.weekdays.push(w); render(); },
  applyplan: function(b){
    var p = findPlan(b.dataset.id), a = S.applying; if (!p || !a || !a.weekdays.length) return;
    var n = doApply(p, a); S.applying = null; S.planDay = a.start;
    toast('Added ' + n + ' workouts from ' + p.name);
    setView('plan');
  },
  newplan: function(){ var e = firstWorkEx(); S.draft = {id:null, name:'', desc:'', days:3, mode:'replace', sessions:[{items: e ? [{ex:e, level:1}] : []}]}; render(); var f = document.getElementById('pd-name'); if (f) f.focus(); },
  editplan: function(b){ var p = findPlan(b.dataset.id); if (!p) return; S.draft = draftFromPlan(p, true); render(); window.scrollTo(0,0); },
  dupplan: function(b){ var p = findPlan(b.dataset.id); if (!p) return; S.draft = draftFromPlan(p, false); render(); window.scrollTo(0,0); },
  delplan: function(b){ removeDoc('meta', b.dataset.id); toast('Plan deleted'); },
  importweek: function(){
    var who = document.getElementById('imp-who'), wk = document.getElementById('imp-week');
    var m = who && S.data.members[who.value]; if (!m) return;
    var w = +wk.value, sessions = [], wds = [];
    for (var j = w*7; j < Math.min(len(), w*7 + 7); j++) {
      var items = ((m.plan && m.plan[j] && m.plan[j].items) || []).filter(function(it){ return !isRest(it); });
      if (items.length) { sessions.push({items: items.map(function(it){ return {ex:it.ex, level:it.level || 1}; })}); wds.push(weekday(j)); }
    }
    if (!sessions.length) { toast(m.name + ' has nothing planned in week ' + (w+1)); return; }
    S.draft = {id:null, name: m.name + '\'s week ' + (w+1), desc:'', days: sessions.length, mode:'replace', sessions: sessions, weekdays: wds};
    render(); window.scrollTo(0,0);
  },
  pdadditem: function(b){ var e = firstWorkEx(); if (!e) return; S.draft.sessions[+b.dataset.s].items.push({ex:e, level:1}); render(); },
  pdrmitem: function(b){ S.draft.sessions[+b.dataset.s].items.splice(+b.dataset.i, 1); render(); },
  pdaddsession: function(){ var e = firstWorkEx(); S.draft.sessions.push({items: e ? [{ex:e, level:1}] : []}); if (S.draft.days < S.draft.sessions.length) S.draft.days = Math.min(7, S.draft.sessions.length); render(); },
  pdrmsession: function(b){ S.draft.sessions.splice(+b.dataset.s, 1); render(); },
  pdcancel: function(){ S.draft = null; render(); },
  pdsave: function(){
    var dr = S.draft, nameEl = document.getElementById('pd-name'), descEl = document.getElementById('pd-desc');
    if (nameEl) dr.name = nameEl.value.trim(); if (descEl) dr.desc = descEl.value.trim();
    if (!dr.name) { toast('Give the plan a name first'); if (nameEl) nameEl.focus(); return; }
    var sessions = dr.sessions.filter(function(s){ return s.items.length; });
    if (!sessions.length) { toast('Add at least one exercise'); return; }
    var id = dr.id || ('plan-' + uid('p'));
    var prev = S.data.meta[id] ? clone(S.data.meta[id]) : {author: S.me || null};
    var doc = Object.assign(prev, {name: dr.name, desc: dr.desc, days: dr.days, mode: dr.mode, sessions: sessions});
    if (dr.weekdays && !dr.id) doc.weekdays = dr.weekdays;
    S.draft = null; save('meta', id, doc); toast('Saved ' + dr.name + ' for everyone');
  },
  /* exercises */
  newex: function(){ S.editEx = '__new'; render(); var f = document.getElementById('exf-name'); if (f) f.focus(); },
  editex: function(b){ S.editEx = b.dataset.id; S.confirmKey = null; render(); },
  cancelex: function(){ S.editEx = null; render(); },
  delex: function(b){ var id = b.dataset.id; S.editEx = null; if (CATALOG[id]) save('exercises', id, {deleted:true}); else removeDoc('exercises', id); toast('Exercise deleted'); },
  /* group */
  color: function(b){ S.colorFor = S.colorFor === b.dataset.id ? null : b.dataset.id; render(); },
  setcolor: function(b){ var m = clone(S.data.members[b.dataset.id]); m.color = +b.dataset.c; S.colorFor = null; save('members', b.dataset.id, m); },
  rmmember: function(b){ var id = b.dataset.id; if (S.me === id) { S.me = null; LS.set('fw.me', null); } removeDoc('members', id); },
  newgroup: function(){ setGroupKey(newGroupKey()); startFirebase(); setView('board'); toast('Group created. Send everyone the invite link.'); },
  copylink: function(){
    var el = document.getElementById('share-link'); if (!el) return;
    function fallback(){ el.focus(); el.select(); toast('Link selected. Copy it from here.'); }
    try { navigator.clipboard.writeText(el.value).then(function(){ toast('Invite link copied'); }, fallback); } catch(e){ fallback(); }
  },
  leavegroup: function(){ groupKeyMem = null; LS.set('fw.group', null); LS.set('fw.me', null); try { history.replaceState(null, '', location.pathname); } catch(e){} location.reload(); }
};
var C = {
  setex: function(el){
    var d = planDayIdx();
    updateMe(function(m){ var it = findItem(m, d, el.dataset.item); if (!it) return; it.ex = el.value; it.level = capLevel(el.value, it.level); });
  },
  setlvl: function(el){ var d = planDayIdx(); updateMe(function(m){ var it = findItem(m, d, el.dataset.item); if (it) it.level = +el.value; }); },
  rename: function(el){
    var v = el.value.trim(); var m = S.data.members[el.dataset.id]; if (!m || !v || v === m.name) { if (m) el.value = m.name; return; }
    var c = clone(m); c.name = v; save('members', el.dataset.id, c);
  },
  apstart: function(el){ if (S.applying) { S.applying.start = +el.value; render(); } },
  approg: function(el){ if (S.applying) { S.applying.prog = +el.value; render(); } },
  apmode: function(el){ if (S.applying) { S.applying.mode = el.value; render(); } },
  aprest: function(el){ if (S.applying) { S.applying.fillRest = el.checked; render(); } },
  pdname: function(el){ if (S.draft) S.draft.name = el.value; },
  pddesc: function(el){ if (S.draft) S.draft.desc = el.value; },
  pddays: function(el){ if (S.draft) S.draft.days = +el.value; },
  pdmode: function(el){ if (S.draft) S.draft.mode = el.value; },
  pdex: function(el){ var it = S.draft.sessions[+el.dataset.s].items[+el.dataset.i]; it.ex = el.value; it.level = capLevel(el.value, it.level); render(); },
  pdlvl: function(el){ S.draft.sessions[+el.dataset.s].items[+el.dataset.i].level = +el.value; }
};
var F = {
  join: function(f){
    var v = f.link.value.trim(), m = v.match(/#k=([A-Za-z0-9_-]{20,64})/) || v.match(/^([A-Za-z0-9_-]{20,64})$/);
    if (!m) { toast('That doesn\'t look like an invite link. It should end in #k= followed by the code.'); return; }
    setGroupKey(m[1]); startFirebase();
  },
  setup: function(f){
    var names = f.names.value.split(/\n|,/).map(function(s){ return s.trim(); }).filter(Boolean);
    save('meta', 'settings', {title: f.title.value.trim() || 'Friends Workout', startDate: f.start.value, length: clamp(parseInt(f.length.value,10) || 28, 1, 366)});
    var taken = Object.assign({}, S.data.members), base = members().length;
    names.forEach(function(n, k){ var id = uniqueId(n, taken, 'm'); taken[id] = 1; save('members', id, {name:n, color:(base + k) % NCOL, order:base + k, plan:[], log:{}}); });
    toast('Board created');
  },
  settings: function(f){
    var st = clone(settings()); st.title = f.title.value.trim() || st.title; st.startDate = f.start.value || st.startDate; st.length = clamp(parseInt(f.length.value,10) || len(), 1, 366);
    save('meta', 'settings', st); toast('Challenge saved');
  },
  addmember: function(f){
    var n = f.name.value.trim(); if (!n) return;
    var id = uniqueId(n, S.data.members, 'm'), used = members().map(function(m){ return (m.color || 0) % NCOL; }), c = 0;
    while (used.indexOf(c) >= 0 && c < NCOL - 1) c++;
    var maxOrder = members().reduce(function(a, m){ return Math.max(a, m.order || 0); }, -1);
    save('members', id, {name:n, color:c, order:maxOrder + 1, plan:[], log:{}});
    toast(n + ' added');
  },
  ex: function(f){
    var id = f.dataset.id, name = f.name.value.trim(); if (!name) return;
    var kind = f.kind.value, levels = kind === 'rest' ? [] : f.levels.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    var prev = id ? clone(ex(id)) : {};
    if (!id) { id = uniqueId(name, exMap(), 'e'); prev.order = 1000 + Object.keys(S.data.exercises).length; }
    prev.name = name; prev.kind = kind; prev.levels = levels; prev.muscles = f.muscles.value.trim();
    var url = f.url.value.trim(); prev.url = url || null; prev.ref = null; delete prev.deleted;
    if (url && !/^https?:\/\//i.test(url)) prev.url = 'https://' + url;
    S.editEx = null; save('exercises', id, prev); toast('Saved ' + name);
  }
};
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
  var key = b.dataset.confirm;
  if (key && S.confirmKey !== key) {
    S.confirmKey = key; render();
    setTimeout(function(){ if (S.confirmKey === key) { S.confirmKey = null; render(); } }, 4000);
    return;
  }
  S.confirmKey = null;
  var fn = A[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('change', function(e){ var el = e.target.closest('[data-chg]'); if (el && C[el.dataset.chg]) C[el.dataset.chg](el); });
document.addEventListener('input', function(e){ if (e.target.id === 'ex-search') { S.exQuery = e.target.value; applyExFilter(); } });
document.addEventListener('submit', function(e){ var f = e.target; if (f.dataset && f.dataset.form) { e.preventDefault(); if (F[f.dataset.form]) F[f.dataset.form](f); } });

/* ---------- boot ---------- */
function startFirebase(){
  var k = groupKey();
  if (!k) { S.mode = 'nogroup'; render(); return; }
  S.store = firebaseStore(CONFIG, k); S.mode = 'firebase'; start();
}
function start(){
  S.store.watch('meta', function(d){ ingest('meta', d); }, 60000);
  S.store.watch('members', function(d){ ingest('members', d); }, 15000);
  S.store.watch('exercises', function(d){ ingest('exercises', d); }, 120000);
  render();
}
render();
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('db').then(function(db){
    if (!db) { S.mode = 'offline'; render(); return; }
    S.store = claudeStore(db); S.mode = 'claude'; start();
    window.claude.use('user').then(function(u){ return u ? u.can('data.write') : null; }).then(function(c){ if (c === false) { S.readOnly = true; render(); } }, function(){});
  }, function(){ S.mode = 'offline'; render(); });
} else if (CONFIG.firebaseProject) {
  startFirebase();
} else {
  S.store = localStore(); S.mode = 'local'; start();
}
setInterval(function(){ if (!document.hidden && !editing()) scheduleRender(); }, 60000);
})();
